[versions]
agp                    = "8.5.2"
kotlin                 = "2.0.21"
compose-bom            = "2024.10.01"
activity-compose       = "1.9.3"
room                   = "2.6.1"
datastore              = "1.1.1"
coroutines             = "1.9.0"
lifecycle              = "2.8.7"
# ── ART / Baseline Profiles ──────────────────────────────────────────────────
profileinstaller       = "1.3.1"
benchmark-macro        = "1.2.4"
uiautomator            = "2.3.0"
test-runner            = "1.5.2"
test-ext-junit         = "1.1.5"

[libraries]
# Compose BOM — single source of truth for all compose versions
compose-bom                  = { group = "androidx.compose",          name = "compose-bom",             version.ref = "compose-bom" }
compose-ui                   = { group = "androidx.compose.ui",       name = "ui"                                                   }
compose-ui-graphics          = { group = "androidx.compose.ui",       name = "ui-graphics"                                          }
compose-material3            = { group = "androidx.compose.material3",name = "material3"                                            }
compose-runtime              = { group = "androidx.compose.runtime",  name = "runtime"                                              }
compose-foundation           = { group = "androidx.compose.foundation",name = "foundation"                                          }
compose-material-icons-ext   = { group = "androidx.compose.material", name = "material-icons-extended"                              }
activity-compose             = { group = "androidx.activity",         name = "activity-compose",        version.ref = "activity-compose" }

# Lifecycle / ViewModel
lifecycle-viewmodel-compose  = { group = "androidx.lifecycle",        name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose    = { group = "androidx.lifecycle",        name = "lifecycle-runtime-compose",   version.ref = "lifecycle" }

# Room (SQLite-backed local search index)
room-runtime                 = { group = "androidx.room",             name = "room-runtime",            version.ref = "room" }
room-compiler                = { group = "androidx.room",             name = "room-compiler",           version.ref = "room" }
room-ktx                     = { group = "androidx.room",             name = "room-ktx",                version.ref = "room" }

# DataStore (settings/prefs)
datastore-preferences        = { group = "androidx.datastore",        name = "datastore-preferences",   version.ref = "datastore" }

# Coroutines
coroutines-android           = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# ── ART / Baseline Profiles ──────────────────────────────────────────────────
profileinstaller             = { group = "androidx.profileinstaller", name = "profileinstaller",           version.ref = "profileinstaller" }
benchmark-macro-junit4       = { group = "androidx.benchmark",        name = "benchmark-macro-junit4",     version.ref = "benchmark-macro"  }
uiautomator                  = { group = "androidx.test.uiautomator", name = "uiautomator",               version.ref = "uiautomator"      }
test-runner                  = { group = "androidx.test",             name = "runner",                     version.ref = "test-runner"      }
test-ext-junit               = { group = "androidx.test.ext",         name = "junit",                      version.ref = "test-ext-junit"   }

[plugins]
android-application          = { id = "com.android.application",             version.ref = "agp"    }
kotlin-android               = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-compose               = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                          = { id = "com.google.devtools.ksp",             version = "2.0.21-1.0.27" }
# ── ART / Baseline Profiles ──────────────────────────────────────────────────
android-test                 = { id = "com.android.test",                    version.ref = "agp"            }
androidx-baselineprofile     = { id = "androidx.baselineprofile",            version.ref = "benchmark-macro" }
