name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── Signing keystore ──────────────────────────────────────────────────
      # Requires the KEYSTORE_BASE64 (+ KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD)
      # repo secrets to produce a signed release build with a consistent key
      # across builds. This repo is public, and GitHub Actions logs AND
      # artifacts on public repos are downloadable by any GitHub user - so,
      # unlike a previous version of this workflow, we do NOT generate a
      # signing keystore in CI and hand it back via an artifact or log output.
      # That previously meant the actual private signing key was uploaded as
      # a public, world-downloadable artifact on any run where the secret
      # wasn't set yet.
      #
      # One-time local setup instead:
      #   keytool -genkeypair -v -keystore aura.jks -alias aura \
      #     -keyalg RSA -keysize 2048 -validity 36500
      #   base64 -w 0 aura.jks
      # Save that output as the KEYSTORE_BASE64 secret, and the store/key
      # passwords + alias you chose as KEYSTORE_PASSWORD / KEY_ALIAS /
      # KEY_PASSWORD. Never commit aura.jks or paste it into a workflow log.
      - name: Resolve signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64:    ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD:  ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:          ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:       ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > aura.jks
            printf 'storeFile=../aura.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::No KEYSTORE_BASE64 secret set - skipping the signed release build this run. See the comment above this step for one-time local setup."
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build Debug APK (signed)
        run: |
          ./gradlew assembleDebug --no-daemon \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }}

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-launcher-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Build Release APK (signed)
        if: steps.keystore.outputs.has_keystore == 'true'
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }}

      - name: Upload Release APK artifact
        if: steps.keystore.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aura-launcher-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # ── GitHub Release (push to main only) ───────────────────────────────
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   v1.0.${{ github.run_number }}
          name:       "v1.0.${{ github.run_number }}"
          prerelease: false
          body: |
            **Commit:** ${{ github.sha }}
            **Message:** ${{ github.event.head_commit.message }}

            > ℹ️ When a signed release build is present, both APKs are signed with the same key — install either one and future builds will update over it seamlessly (no uninstall needed). If only the debug APK is attached, the `KEYSTORE_BASE64` secret isn't set yet — see the "Resolve signing keystore" step in this run's log for one-time local setup instructions.
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Stable tag release ────────────────────────────────────────────────
      - name: Create stable release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
